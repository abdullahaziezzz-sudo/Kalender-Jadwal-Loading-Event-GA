<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Loading Event GA</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --loading-bg: #f1f5f9;
      --input-bg: #ffffff;
    }

    /* Variabel Warna Mode Gelap (Black/Dark) */
    [data-theme="dark"] {
      --primary: #60a5fa;
      --primary-light: #1e293b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --loading-bg: #0f172a;
      --input-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary);
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: left;
    }

    /* Tombol Tema (White / Black) */
    .theme-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .theme-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-container {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-item {
      flex: 1;
      min-width: 130px;
    }

    .filter-item label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .event-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .event-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .event-date-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .info-value {
      font-weight: 600;
    }

    .loading-box {
      background: var(--loading-bg);
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .loading-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .no-data, .loading-status {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Kalender & Jadwal Loading Event GA</h1>
      <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">🌙 Mode Gelap</button>
    </div>
    <p class="subtitle">Sistem Informasi & Jadwal Operasional</p>
  </header>

  <div class="filter-container">
    <div class="filter-group">
      <!-- Filter Tanggal Spesifik -->
      <div class="filter-item">
        <label for="dateFilter">Tanggal Event:</label>
        <select id="dateFilter" onchange="filterEvents()">
          <option value="all">-- Semua Tanggal --</option>
        </select>
      </div>

      <!-- Filter Bulan -->
      <div class="filter-item">
        <label for="monthFilter">Bulan:</label>
        <select id="monthFilter" onchange="filterEvents()">
          <option value="all">-- Semua Bulan --</option>
          <option value="1">Januari</option>
          <option value="2">Februari</option>
          <option value="3">Maret</option>
          <option value="4">April</option>
          <option value="5">Mei</option>
          <option value="6">Juni</option>
          <option value="7">Juli</option>
          <option value="8">Agustus</option>
          <option value="9">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>
      </div>

      <!-- Filter Tahun -->
      <div class="filter-item">
        <label for="yearFilter">Tahun:</label>
        <select id="yearFilter" onchange="filterEvents()">
          <option value="all">-- Semua Tahun --</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
    </div>
  </div>

  <div id="statusMessage" class="loading-status">Mengambil data terbaru dari Google Sheets...</div>
  <div class="event-list" id="eventList"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyb3UPksPpFon3SjcyIGJCOZTL7gxzxHsswVx7TTA41jc6vSBn7nnarDx2-i6NXIIrOpg/exec";
    let allEvents = [];

    /* Inisialisasi Tema (Hitam / Putih) */
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButton(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    }

    function updateThemeButton(theme) {
      const btn = document.getElementById('themeToggle');
      if (btn) {
        if (theme === 'dark') {
          btn.innerHTML = '☀️ Mode Terang';
        } else {
          btn.innerHTML = '🌙 Mode Gelap';
        }
      }
    }

    function formatDate(val) {
      if (!val || val === '-') return '-';
      if (typeof val === 'string' && val.includes('T')) {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
      }
      return val;
    }

    function formatTime(val) {
      if (!val || val === '-') return '';
      if (typeof val === 'string' && val.includes('T')) {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          const hours = String(d.getHours()).padStart(2, '0');
          const minutes = String(d.getMinutes()).padStart(2, '0');
          return `(${hours}:${minutes})`;
        }
      }
      return val ? `(${val})` : '';
    }

    async function loadData() {
      const statusEl = document.getElementById('statusMessage');
      try {
        const response = await fetch(API_URL);
        allEvents = await response.json();
        
        statusEl.style.display = 'none';
        populateDropdown(allEvents);
        renderCards(allEvents);
      } catch (error) {
        statusEl.textContent = 'Gagal memuat data. Pastikan jaringan stabil.';
      }
    }

    function populateDropdown(events) {
      const select = document.getElementById('dateFilter');
      const dates = [...new Set(events.map(e => e.tanggalEvent).filter(Boolean))];
      
      dates.forEach(date => {
        const opt = document.createElement('option');
        opt.value = date;
        opt.textContent = date;
        select.appendChild(opt);
      });
    }

    function renderCards(events) {
      const listEl = document.getElementById('eventList');
      listEl.innerHTML = '';

      if (events.length === 0) {
        listEl.innerHTML = '<div class="no-data">Tidak ada jadwal event untuk filter yang dipilih.</div>';
        return;
      }

      events.forEach(item => {
        const card = document.createElement('div');
        card.className = 'event-card';

        const loadingInFormatted = formatDate(item.loadingIn);
        const loadingInTime = formatTime(item.jamLoadingIn);
        
        const loadingOutFormatted = formatDate(item.loadingOut);
        const loadingOutTime = formatTime(item.jamLoadingOut);

        card.innerHTML = `
          <div class="event-header">
            <div class="event-title">${item.namaEvent}</div>
            <span class="event-date-badge">📅 ${item.tanggalEvent}</span>
          </div>
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">PIC</span>
              <span class="info-value">${item.pic}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Lokasi</span>
              <span class="info-value">${item.lokasi}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Jam Event</span>
              <span class="info-value">${item.jamEvent}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Kendaraan</span>
              <span class="info-value">${item.kendaraan}</span>
            </div>
          </div>
          <div class="loading-box">
            <div class="loading-title">Jadwal Loading</div>
            <p><strong>Loading In:</strong> ${loadingInFormatted} ${loadingInTime}</p>
            <p><strong>Loading Out:</strong> ${loadingOutFormatted} ${loadingOutTime}</p>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function filterEvents() {
      const selectedDate = document.getElementById('dateFilter').value;
      const selectedMonth = document.getElementById('monthFilter').value;
      const selectedYear = document.getElementById('yearFilter').value;

      const filtered = allEvents.filter(e => {
        let isMatch = true;

        if (selectedDate !== 'all' && e.tanggalEvent !== selectedDate) {
          isMatch = false;
        }

        if (e.tanggalEvent && (selectedMonth !== 'all' || selectedYear !== 'all')) {
          const d = new Date(e.tanggalEvent);
          if (!isNaN(d.getTime())) {
            const evMonth = (d.getMonth() + 1).toString();
            const evYear = d.getFullYear().toString();

            if (selectedMonth !== 'all' && evMonth !== selectedMonth) {
              isMatch = false;
            }
            if (selectedYear !== 'all' && evYear !== selectedYear) {
              isMatch = false;
            }
          }
        }

        return isMatch;
      });

      renderCards(filtered);
    }

    /* Jalankan Pengaturan Tema & Muat Data */
    initTheme();
    loadData();
  </script>

</body>
</html>
