<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Loading Event GA - Ninja Edition</title>
  <style>
    :root {
      --primary: #ea580c; /* Oranye Naruto */
      --primary-hover: #c2410c;
      --chakra: #0284c7; /* Biru Chakra Rasengan */
      --primary-light: #ffedd5;
      --bg: #fff7ed;
      --card-bg: #ffffff;
      --text: #1c1917;
      --text-muted: #78716c;
      --border: #fed7aa;
      --loading-bg: #ffedd5;
      --input-bg: #ffffff;
    }

    /* Mode Gelap (Dark Mode / Akatsuki Theme) */
    [data-theme="dark"] {
      --primary: #f97316;
      --primary-hover: #fb923c;
      --chakra: #38bdf8;
      --primary-light: #292524;
      --bg: #0c0a09;
      --card-bg: #1c1917;
      --text: #f5f5f4;
      --text-muted: #a8a29e;
      --border: #44403c;
      --loading-bg: #292524;
      --input-bg: #1c1917;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 850px;
      margin: 0 auto;
    }

    /* Header & Naruto Mascot Banner */
    header {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .mascot-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .naruto-avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
      background: var(--primary-light);
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.3);
    }

    h1 {
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    p.subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Header Actions Buttons */
    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-action:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Search & Filter Section */
    .filter-container {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--chakra);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-item {
      flex: 1;
      min-width: 120px;
    }

    .filter-item label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      background-color: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    /* Counter Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .event-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .counter-badge {
      background: var(--primary);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    /* Event Cards */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .event-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 5px;
      background: var(--primary);
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.15);
      border-color: var(--chakra);
    }

    .event-header {
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .event-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-date-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 0.85rem;
    }

    @media (max-width: 520px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .info-value {
      font-weight: 600;
    }

    .loading-box {
      background: var(--loading-bg);
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .loading-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .no-data, .loading-status {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Print Styling */
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      header, .filter-container, .header-actions { display: none; }
      .event-card { border: 1px solid #ccc; break-inside: avoid; margin-bottom: 12px; }
    }
  </style>
</head>
<body>

  <!-- Header Bertema Naruto -->
  <header>
    <div class="header-top">
      <div class="mascot-title-box">
        <!-- Gambar Naruto Avatar -->
        <img class="naruto-avatar" src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Naruto_logo.svg" alt="Naruto Icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3579/3579130.png'">
        <div>
          <h1>🍃 Jadwal Loading Event GA</h1>
          <p class="subtitle">Sistem Operasional & Logistik Tim Ninja</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-action" onclick="window.print()">🖨️ Cetak</button>
        <button id="themeToggle" class="btn-action" onclick="toggleTheme()">🌙 Dark</button>
      </div>
    </div>
  </header>

  <!-- Section Filter & Pencarian -->
  <div class="filter-container">
    <!-- Search Bar -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" onkeyup="filterEvents()" placeholder="Cari nama event, lokasi, atau PIC...">
    </div>

    <div class="filter-group">
      <!-- Filter Tanggal Spesifik -->
      <div class="filter-item">
        <label for="dateFilter">Tanggal Event</label>
        <select id="dateFilter" onchange="filterEvents()">
          <option value="all">Semua Tanggal</option>
        </select>
      </div>

      <!-- Filter Bulan -->
      <div class="filter-item">
        <label for="monthFilter">Bulan</label>
        <select id="monthFilter" onchange="filterEvents()">
          <option value="all">Semua Bulan</option>
          <option value="1">Januari</option>
          <option value="2">Februari</option>
          <option value="3">Maret</option>
          <option value="4">April</option>
          <option value="5">Mei</option>
          <option value="6">Juni</option>
          <option value="7">Juli</option>
          <option value="8">Agustus</option>
          <option value="9">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>
      </div>

      <!-- Filter Tahun -->
      <div class="filter-item">
        <label for="yearFilter">Tahun</label>
        <select id="yearFilter" onchange="filterEvents()">
          <option value="all">Semua Tahun</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Status Bar Counter -->
  <div class="status-bar">
    <div class="event-counter">
      <span>📜 Total Misi/Event:</span>
      <span id="totalCounter" class="counter-badge">0</span>
    </div>
  </div>

  <div id="statusMessage" class="loading-status">🌀 Mengumpulkan Chakra & Data dari Google Sheets...</div>
  <div class="event-list" id="eventList"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyb3UPksPpFon3SjcyIGJCOZTL7gxzxHsswVx7TTA41jc6vSBn7nnarDx2-i6NXIIrOpg/exec";
    let allEvents = [];

    /* System Theme (Light / Dark) */
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButton(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    }

    function updateThemeButton(theme) {
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.innerHTML = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
      }
    }

    function formatDate(val) {
      if (!val || val === '-') return '-';
      if (typeof val === 'string' && val.includes('T')) {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
      }
      return val;
    }

    function formatTime(val) {
      if (!val || val === '-') return '';
      if (typeof val === 'string' && val.includes('T')) {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          const hours = String(d.getHours()).padStart(2, '0');
          const minutes = String(d.getMinutes()).padStart(2, '0');
          return `(${hours}:${minutes})`;
        }
      }
      return val ? `(${val})` : '';
    }

    async function loadData() {
      const statusEl = document.getElementById('statusMessage');
      try {
        const response = await fetch(API_URL);
        allEvents = await response.json();
        
        statusEl.style.display = 'none';
        populateDropdown(allEvents);
        renderCards(allEvents);
      } catch (error) {
        statusEl.textContent = '❌ Gagal memuat data. Pastikan koneksi internet stabil.';
      }
    }

    function populateDropdown(events) {
      const select = document.getElementById('dateFilter');
      const dates = [...new Set(events.map(e => e.tanggalEvent).filter(Boolean))];
      
      dates.forEach(date => {
        const opt = document.createElement('option');
        opt.value = date;
        opt.textContent = date;
        select.appendChild(opt);
      });
    }

    function renderCards(events) {
      const listEl = document.getElementById('eventList');
      const counterEl = document.getElementById('totalCounter');
      listEl.innerHTML = '';
      counterEl.textContent = events.length;

      if (events.length === 0) {
        listEl.innerHTML = '<div class="no-data">🍃 Tidak ada jadwal event / misi yang cocok.</div>';
        return;
      }

      events.forEach(item => {
        const card = document.createElement('div');
        card.className = 'event-card';

        const loadingInFormatted = formatDate(item.loadingIn);
        const loadingInTime = formatTime(item.jamLoadingIn);
        
        const loadingOutFormatted = formatDate(item.loadingOut);
        const loadingOutTime = formatTime(item.jamLoadingOut);

        card.innerHTML = `
          <div class="event-header">
            <div class="event-title">📜 ${item.namaEvent || 'Event GA'}</div>
            <span class="event-date-badge">📅 ${item.tanggalEvent || '-'}</span>
          </div>
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">👤 PIC Misi</span>
              <span class="info-value">${item.pic || '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">📍 Lokasi</span>
              <span class="info-value">${item.lokasi || '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">⏰ Jam Event</span>
              <span class="info-value">${item.jamEvent || '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">🚚 Kendaraan</span>
              <span class="info-value">${item.kendaraan || '-'}</span>
            </div>
          </div>
          <div class="loading-box">
            <div class="loading-title">⚡ Jadwal Loading Operasional</div>
            <p><strong>Loading In:</strong> ${loadingInFormatted} ${loadingInTime}</p>
            <p><strong>Loading Out:</strong> ${loadingOutFormatted} ${loadingOutTime}</p>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function filterEvents() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const selectedDate = document.getElementById('dateFilter').value;
      const selectedMonth = document.getElementById('monthFilter').value;
      const selectedYear = document.getElementById('yearFilter').value;

      const filtered = allEvents.filter(e => {
        let isMatch = true;

        // 1. Filter Pencarian Teks
        if (searchText) {
          const nameMatch = (e.namaEvent || '').toLowerCase().includes(searchText);
          const picMatch = (e.pic || '').toLowerCase().includes(searchText);
          const locationMatch = (e.lokasi || '').toLowerCase().includes(searchText);
          if (!nameMatch && !picMatch && !locationMatch) {
            isMatch = false;
          }
        }

        // 2. Filter Tanggal Spesifik
        if (selectedDate !== 'all' && e.tanggalEvent !== selectedDate) {
          isMatch = false;
        }

        // 3. Filter Bulan dan Tahun
        if (e.tanggalEvent && (selectedMonth !== 'all' || selectedYear !== 'all')) {
          const d = new Date(e.tanggalEvent);
          if (!isNaN(d.getTime())) {
            const evMonth = (d.getMonth() + 1).toString();
            const evYear = d.getFullYear().toString();

            if (selectedMonth !== 'all' && evMonth !== selectedMonth) {
              isMatch = false;
            }
            if (selectedYear !== 'all' && evYear !== selectedYear) {
              isMatch = false;
            }
          }
        }

        return isMatch;
      });

      renderCards(filtered);
    }

    /* Inisialisasi */
    initTheme();
    loadData();
  </script>

</body>
</html>
